<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudBridge module removal QA</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 32px;
        color: #ecf8fa;
        background: #050b12;
        font-family: Inter, "PingFang SC", sans-serif;
      }
      main {
        max-width: 1040px;
        margin: 0 auto;
        padding: 24px;
        border: 1px solid #1c3543;
        border-radius: 18px;
        background: #08131d;
      }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 22px; color: #8ea9b7; }
      section { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
      figure { margin: 0; overflow: hidden; border: 1px solid #203947; border-radius: 12px; background: #02070c; }
      figcaption { padding: 11px 13px; color: #9eb7c3; border-bottom: 1px solid #203947; }
      img { width: 100%; height: auto; display: block; }
    </style>
  </head>
  <body>
    <main>
      <h1>客户端流程模块删除验证</h1>
      <p>左侧为用户指定删除的模块，右侧为删除后的商品区到客服区衔接。</p>
      <section>
        <figure>
          <figcaption>删除目标</figcaption>
          <img src="./evidence/source-connected-flow-module.png" alt="需要删除的三步流程模块" />
        </figure>
        <figure>
          <figcaption>当前实现</figcaption>
          <img src="./evidence/client-contact-after-removal-390.png" alt="删除后商品区直接连接客服区" />
        </figure>
      </section>
    </main>
  </body>
</html>
